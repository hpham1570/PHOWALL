<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Marketing Pipeline — 16-Agent System v2.0</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0f;color:#e2e8f0;font-family:'Inter',sans-serif;min-height:100vh}
  ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:#0a0a0f}::-webkit-scrollbar-thumb{background:#2d2d3d;border-radius:2px}
  .app{max-width:1400px;margin:0 auto;padding:20px}
  /* HEADER */
  .header{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;background:linear-gradient(135deg,#1a0a2e,#0d1117);border:1px solid #2d1b69;border-radius:12px;margin-bottom:20px}
  .logo{display:flex;align-items:center;gap:12px}
  .logo-icon{width:40px;height:40px;background:linear-gradient(135deg,#7c3aed,#db2777);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
  .logo-text{font-size:18px;font-weight:700;background:linear-gradient(135deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .logo-sub{font-size:11px;color:#6b7280;font-family:'JetBrains Mono',monospace}
  .header-stats{display:flex;gap:16px}
  .stat-pill{background:#1a1a2e;border:1px solid #2d2d4e;border-radius:20px;padding:6px 14px;font-size:12px;font-family:'JetBrains Mono',monospace}
  .stat-pill span{color:#a78bfa;font-weight:600}
  /* API KEY */
  .api-section{background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
  .api-label{font-size:12px;color:#6b7280;font-family:'JetBrains Mono',monospace;white-space:nowrap}
  .api-input{flex:1;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 12px;color:#e2e8f0;font-family:'JetBrains Mono',monospace;font-size:12px;outline:none}
  .api-input:focus{border-color:#7c3aed}
  .btn{padding:8px 16px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s}
  .btn-primary{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff}
  .btn-primary:hover{opacity:0.85;transform:translateY(-1px)}
  .btn-sm{padding:5px 10px;font-size:11px}
  .btn-outline{background:transparent;border:1px solid #374151;color:#9ca3af}
  .btn-outline:hover{border-color:#7c3aed;color:#a78bfa}
  /* CAMPAIGN INPUT */
  .campaign-section{background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:20px;margin-bottom:20px}
  .section-title{font-size:13px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;font-family:'JetBrains Mono',monospace}
  .input-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px}
  .input-group{display:flex;flex-direction:column;gap:6px}
  .input-label{font-size:11px;color:#6b7280}
  .input-field{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:8px 12px;color:#e2e8f0;font-size:13px;outline:none;width:100%}
  .input-field:focus{border-color:#7c3aed}
  textarea.input-field{resize:vertical;min-height:80px;font-family:'Inter',sans-serif}
  .run-btn{width:100%;padding:12px;background:linear-gradient(135deg,#7c3aed,#db2777);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all 0.2s;margin-top:12px}
  .run-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 4px 20px rgba(124,58,237,0.4)}
  .run-btn:disabled{opacity:0.5;cursor:not-allowed}
  /* PIPELINE LAYERS */
  .pipeline{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
  .layer{background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:16px}
  .layer-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .layer-badge{font-size:10px;font-family:'JetBrains Mono',monospace;padding:3px 8px;border-radius:4px;font-weight:600}
  .badge-apex{background:#1c1029;color:#c084fc;border:1px solid #4c1d95}
  .badge-input{background:#0f1f1a;color:#34d399;border:1px solid #064e3b}
  .badge-mgmt{background:#1a1200;color:#fbbf24;border:1px solid #78350f}
  .badge-coord{background:#0f172a;color:#60a5fa;border:1px solid #1e3a5f}
  .badge-exec{background:#1a0a1a;color:#e879f9;border:1px solid #4a044e}
  .badge-output{background:#0f1a0f;color:#86efac;border:1px solid #14532d}
  .layer-name{font-size:13px;font-weight:600;color:#9ca3af}
  .agents-row{display:grid;gap:10px}
  .agents-1{grid-template-columns:1fr}
  .agents-2{grid-template-columns:1fr 1fr}
  .agents-3{grid-template-columns:1fr 1fr 1fr}
  .agents-4{grid-template-columns:repeat(4,1fr)}
  .agents-5{grid-template-columns:repeat(5,1fr)}
  /* AGENT CARD */
  .agent-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:12px;transition:all 0.3s;position:relative;overflow:hidden}
  .agent-card.active{border-color:#7c3aed;box-shadow:0 0 15px rgba(124,58,237,0.2)}
  .agent-card.done{border-color:#059669;box-shadow:0 0 10px rgba(5,150,105,0.15)}
  .agent-card.error{border-color:#dc2626;box-shadow:0 0 10px rgba(220,38,38,0.15)}
  .agent-card.skip{opacity:0.4}
  .agent-progress{position:absolute;bottom:0;left:0;height:2px;background:linear-gradient(90deg,#7c3aed,#db2777);transition:width 0.5s;border-radius:0 0 0 8px}
  .agent-icon{font-size:22px;margin-bottom:6px}
  .agent-name{font-size:12px;font-weight:600;color:#e2e8f0;margin-bottom:2px}
  .agent-role{font-size:10px;color:#6b7280;margin-bottom:8px}
  .agent-status{display:flex;align-items:center;gap:5px;font-size:10px;font-family:'JetBrains Mono',monospace}
  .status-dot{width:6px;height:6px;border-radius:50%}
  .dot-idle{background:#4b5563}
  .dot-active{background:#7c3aed;animation:pulse 1s infinite}
  .dot-done{background:#059669}
  .dot-error{background:#dc2626}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
  .agent-output{margin-top:8px;background:#0d1117;border-radius:4px;padding:8px;font-size:10px;color:#9ca3af;font-family:'JetBrains Mono',monospace;max-height:80px;overflow-y:auto;line-height:1.5}
  /* ACTIVITY STREAM */
  .activity{background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:16px;margin-bottom:20px}
  .activity-list{max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
  .activity-item{display:flex;gap:8px;font-size:11px;font-family:'JetBrains Mono',monospace;padding:4px 0;border-bottom:1px solid #161b22}
  .activity-time{color:#4b5563;white-space:nowrap}
  .activity-agent{color:#a78bfa;white-space:nowrap;min-width:120px}
  .activity-msg{color:#9ca3af}
  .activity-msg.success{color:#34d399}
  .activity-msg.error{color:#f87171}
  .activity-msg.warn{color:#fbbf24}
  /* OUTPUT */
  .output-section{background:#0d1117;border:1px solid #21262d;border-radius:10px;padding:20px}
  .output-tabs{display:flex;gap:8px;margin-bottom:16px}
  .tab-btn{padding:6px 14px;border-radius:6px;border:1px solid #30363d;background:transparent;color:#6b7280;font-size:12px;cursor:pointer;transition:all 0.2s}
  .tab-btn.active{background:#1a0a2e;border-color:#7c3aed;color:#a78bfa}
  .output-content{background:#161b22;border-radius:8px;padding:16px;min-height:120px;font-size:13px;line-height:1.7;color:#d1d5db;white-space:pre-wrap}
  .output-placeholder{color:#374151;font-style:italic;font-size:12px}
  /* FOOTER STATS */
  .footer-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:20px}
  .stat-card{background:#0d1117;border:1px solid #21262d;border-radius:8px;padding:14px;text-align:center}
  .stat-value{font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace;background:linear-gradient(135deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stat-label{font-size:11px;color:#6b7280;margin-top:4px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useCallback } = React;

const AGENTS = [
  // Layer 0 - Apex
  { id:'cto', name:'CTO / Director', role:'Apex Authority', icon:'⭐', layer:'apex', desc:'Final decision & vision' },
  // Layer 1 - Input
  { id:'intake', name:'Intake Agent', role:'Validate & Classify', icon:'📥', layer:'input', desc:'Filter & route requests' },
  { id:'security', name:'Security Agent', role:'Safety Check', icon:'🔒', layer:'input', desc:'Permissions & injection guard' },
  // Layer 2 - Management
  { id:'manager', name:'Manager Agent', role:'Campaign Manager', icon:'🎯', layer:'mgmt', desc:'Tactical operations' },
  // Layer 3 - Oversight
  { id:'supervisor', name:'Supervisor', role:'Pipeline Oversight', icon:'👁️', layer:'coord', desc:'Monitor all layers' },
  // Layer 4 - Coordination
  { id:'planner', name:'Planner', role:'Scheduler', icon:'📅', layer:'coord', desc:'Timeline & capacity' },
  { id:'lead', name:'Lead Agent', role:'Creative Director', icon:'🎨', layer:'coord', desc:'Coordinate assembly' },
  { id:'audit', name:'Audit Agent', role:'Independent Audit', icon:'🔍', layer:'coord', desc:'Compliance & anomaly' },
  { id:'loadbalancer', name:'Load Balancer', role:'Work Distribution', icon:'⚖️', layer:'coord', desc:'Distribute to assembly' },
  { id:'errorrecovery', name:'Error Recovery', role:'Failure Handler', icon:'🔧', layer:'coord', desc:'Rollback & retry' },
  // Layer 5 - Execution
  { id:'researcher', name:'Researcher', role:'Assembly Agent 1', icon:'🔬', layer:'exec', desc:'Market & audience research' },
  { id:'strategist', name:'Strategist', role:'Assembly Agent 2', icon:'🧠', layer:'exec', desc:'Campaign strategy' },
  { id:'creator', name:'Content Creator', role:'Assembly Agent 3', icon:'✍️', layer:'exec', desc:'Generate content' },
  { id:'qc', name:'QC Agent', role:'Brand Compliance', icon:'✅', layer:'exec', desc:'Pass / Fail check' },
  // Layer 6 - Output
  { id:'reporter', name:'Reporter', role:'Analytics & KPIs', icon:'📊', layer:'output', desc:'Performance metrics' },
  { id:'comms', name:'Comms Agent', role:'Notification', icon:'📣', layer:'output', desc:'Deliver final output' },
];

const LAYERS = [
  { id:'apex',   label:'LAYER 0 — APEX AUTHORITY',        badge:'badge-apex',   agentIds:['cto'] },
  { id:'input',  label:'INPUT LAYER — VALIDATE & SECURE', badge:'badge-input',  agentIds:['intake','security'] },
  { id:'mgmt',   label:'LAYER 1 — MANAGEMENT',            badge:'badge-mgmt',   agentIds:['manager'] },
  { id:'coord',  label:'LAYER 2-3 — OVERSIGHT & COORDINATION', badge:'badge-coord', agentIds:['supervisor','planner','lead','audit','loadbalancer','errorrecovery'] },
  { id:'exec',   label:'LAYER 4 — EXECUTION',             badge:'badge-exec',   agentIds:['researcher','strategist','creator','qc'] },
  { id:'output', label:'OUTPUT LAYER',                    badge:'badge-output', agentIds:['reporter','comms'] },
];

const GRID_CLASS = { 1:'agents-1', 2:'agents-2', 3:'agents-3', 4:'agents-4', 5:'agents-5', 6:'agents-4' };

function App() {
  const [apiKey, setApiKey] = useState('');
  const [keySet, setKeySet] = useState(false);
  const [brand, setBrand] = useState('');
  const [product, setProduct] = useState('');
  const [audience, setAudience] = useState('');
  const [goal, setGoal] = useState('');
  const [platform, setPlatform] = useState('Facebook');
  const [lang, setLang] = useState('vi');
  const [running, setRunning] = useState(false);
  const [agentStates, setAgentStates] = useState({});
  const [agentOutputs, setAgentOutputs] = useState({});
  const [agentProgress, setAgentProgress] = useState({});
  const [activity, setActivity] = useState([]);
  const [outputs, setOutputs] = useState({ strategy:'', content:'', kpi:'' });
  const [activeTab, setActiveTab] = useState('content');
  const [stats, setStats] = useState({ runs:0, agents:0, tokens:0, time:0 });
  const abortRef = useRef(false);

  const log = useCallback((agentId, msg, type='info') => {
    const agent = AGENTS.find(a=>a.id===agentId);
    setActivity(prev => [{
      time: new Date().toLocaleTimeString('vi-VN'),
      agent: agent?.name || agentId,
      msg, type
    }, ...prev].slice(0,50));
  }, []);

  const setAgentState = (id, state, output='', progress=0) => {
    setAgentStates(p=>({...p,[id]:state}));
    if(output) setAgentOutputs(p=>({...p,[id]:output}));
    setAgentProgress(p=>({...p,[id]:progress}));
  };

  const callClaude = async (systemPrompt, userMsg) => {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-api-key': apiKey, 'anthropic-version':'2023-06-01' },
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:1000,
        system: systemPrompt,
        messages:[{role:'user',content:userMsg}]
      })
    });
    const data = await res.json();
    if(data.error) throw new Error(data.error.message);
    return data.content[0].text;
  };

  const sleep = ms => new Promise(r=>setTimeout(r,ms));

  const runPipeline = async () => {
    if(!apiKey||!brand||!product||!goal) return;
    abortRef.current = false;
    setRunning(true);
    setActivity([]);
    setOutputs({strategy:'',content:'',kpi:''});
    const startTime = Date.now();
    let totalTokens = 0;
    let agentsUsed = 0;

    const run = async (id, systemPrompt, userMsg, layer) => {
      if(abortRef.current) return '';
      setAgentState(id,'active','',10);
      log(id, `Đang xử lý...`);
      await sleep(300);
      setAgentProgress(p=>({...p,[id]:50}));
      try {
        const result = await callClaude(systemPrompt, userMsg);
        setAgentState(id,'done', result.slice(0,120)+'…', 100);
        log(id, `✓ Hoàn thành`, 'success');
        agentsUsed++;
        totalTokens += result.length / 4;
        return result;
      } catch(e) {
        setAgentState(id,'error', e.message, 0);
        log(id, `✗ Lỗi: ${e.message}`, 'error');
        return '';
      }
    };

    const ctx = `Brand: ${brand} | Sản phẩm: ${product} | Khách hàng: ${audience} | Mục tiêu: ${goal} | Nền tảng: ${platform} | Ngôn ngữ: ${lang==='vi'?'Tiếng Việt':'English'}`;

    try {
      // L0 - CTO
      setAgentState('cto','active','',20);
      log('cto','Khởi động pipeline — xác nhận vision');
      await sleep(400);
      setAgentState('cto','done','Pipeline approved ✓',100);

      // L1 Input
      await run('intake','Bạn là Intake Agent. Validate và classify marketing request. Trả lời ngắn gọn bằng JSON: {valid:true/false, type, priority, route}', ctx);
      await run('security','Bạn là Security Agent. Check safety và brand compliance. Trả lời ngắn gọn: {safe:true/false, concerns:[]}', ctx);

      // L2 Manager
      const managerPlan = await run('manager', `Bạn là Campaign Manager. Tạo kế hoạch chiến dịch tổng thể cho: ${ctx}. Ngắn gọn, 3-4 bullet points.`, 'Lên kế hoạch campaign');

      // L3 Coordination
      setAgentState('supervisor','active','',30);
      log('supervisor','Phân công team...');
      await sleep(500);
      setAgentState('supervisor','done','Team assigned ✓',100);

      await run('planner','Bạn là Planner. Lên lịch timeline 4 tuần cho campaign. Ngắn gọn.', `${ctx}\nManager plan: ${managerPlan}`);
      await run('audit','Bạn là Audit Agent (độc lập). Kiểm tra compliance và risk. Ngắn gọn.', ctx);
      setAgentState('loadbalancer','active','',50);
      log('loadbalancer','Phân phối tasks cho Assembly...');
      await sleep(400);
      setAgentState('loadbalancer','done','Tasks distributed ✓',100);
      setAgentState('errorrecovery','active','',50);
      log('errorrecovery','Cấu hình retry strategy...');
      await sleep(300);
      setAgentState('errorrecovery','done','Recovery ready ✓',100);

      // L4 Lead
      const leadBrief = await run('lead', `Bạn là Creative Director. Tạo creative brief cho content team. ${lang==='vi'?'Trả lời tiếng Việt.':'Reply in English.'}`, `${ctx}\nCampaign plan: ${managerPlan}`);

      // L5 Assembly
      const research = await run('researcher', `Bạn là Marketing Researcher. Phân tích target audience và market insights. ${lang==='vi'?'Trả lời tiếng Việt.':'Reply in English.'} Ngắn gọn, 3-4 insights.`, ctx);

      const strategy = await run('strategist', `Bạn là Marketing Strategist. Tạo chiến lược nội dung ${platform} chi tiết. ${lang==='vi'?'Trả lời tiếng Việt.':'Reply in English.'} Bao gồm tone, timing, engagement tactics.`, `${ctx}\nResearch: ${research}\nBrief: ${leadBrief}`);

      const content = await run('creator', `Bạn là Content Creator chuyên ${platform}. Tạo 3 posts hoàn chỉnh gồm caption, hashtags, CTA. ${lang==='vi'?'Viết tiếng Việt, sinh động, thuyết phục.':'Write engaging English copy.'} Dùng emoji và visual cues.`,
        `${ctx}\nStrategy: ${strategy}\nBrief: ${leadBrief}`);

      // QC
      const qcResult = await run('qc', `Bạn là QC Agent. Review content này theo tiêu chí: brand voice, accuracy, engagement potential, compliance. Chấm điểm /10 và feedback.`, `Content created:\n${content}`);

      // Output Layer
      const kpi = await run('reporter', `Bạn là Analytics Agent. Đề xuất KPIs và metrics để đo lường hiệu quả campaign. ${lang==='vi'?'Tiếng Việt.':'English.'} Ngắn gọn, 5 KPIs.`, `Strategy: ${strategy}\nQC Feedback: ${qcResult}`);

      setAgentState('comms','active','',50);
      log('comms','Đóng gói output cuối...');
      await sleep(500);
      setAgentState('comms','done','Output delivered ✓',100);
      log('comms','🎉 Pipeline hoàn thành!','success');

      setOutputs({ strategy, content, kpi });
      setStats(p=>({
        runs: p.runs+1,
        agents: agentsUsed,
        tokens: Math.round(totalTokens),
        time: Math.round((Date.now()-startTime)/1000)
      }));

    } catch(e) {
      log('cto', `Pipeline error: ${e.message}`, 'error');
    }
    setRunning(false);
  };

  const getGridClass = (count) => GRID_CLASS[Math.min(count,6)] || 'agents-4';

  return (
    <div className="app">
      {/* HEADER */}
      <div className="header">
        <div className="logo">
          <div className="logo-icon">🚀</div>
          <div>
            <div className="logo-text">Marketing Pipeline AI</div>
            <div className="logo-sub">16-Agent System v2.0 · Powered by Claude</div>
          </div>
        </div>
        <div className="header-stats">
          <div className="stat-pill">Runs: <span>{stats.runs}</span></div>
          <div className="stat-pill">Agents: <span>16</span></div>
          <div className="stat-pill">Last: <span>{stats.time}s</span></div>
        </div>
      </div>

      {/* API KEY */}
      <div className="api-section">
        <div className="api-label">ANTHROPIC API KEY</div>
        <input className="api-input" type="password" placeholder="sk-ant-api03-..." value={apiKey} onChange={e=>setApiKey(e.target.value)} />
        <button className="btn btn-primary btn-sm" onClick={()=>setKeySet(true)}>
          {keySet ? '✓ Ready' : 'Set Key'}
        </button>
      </div>

      {/* CAMPAIGN INPUT */}
      <div className="campaign-section">
        <div className="section-title">⚡ Campaign Brief</div>
        <div className="input-grid">
          <div className="input-group">
            <div className="input-label">Tên Brand</div>
            <input className="input-field" placeholder="VD: Phở Bà Năm" value={brand} onChange={e=>setBrand(e.target.value)} />
          </div>
          <div className="input-group">
            <div className="input-label">Sản phẩm / Dịch vụ</div>
            <input className="input-field" placeholder="VD: Phở bò đặc biệt" value={product} onChange={e=>setProduct(e.target.value)} />
          </div>
          <div className="input-group">
            <div className="input-label">Khách hàng mục tiêu</div>
            <input className="input-field" placeholder="VD: Người Việt 25-45 tuổi" value={audience} onChange={e=>setAudience(e.target.value)} />
          </div>
        </div>
        <div className="input-grid">
          <div className="input-group" style={{gridColumn:'span 2'}}>
            <div className="input-label">Mục tiêu campaign</div>
            <input className="input-field" placeholder="VD: Tăng khách đến quán 30% trong tháng 7" value={goal} onChange={e=>setGoal(e.target.value)} />
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
            <div className="input-group">
              <div className="input-label">Nền tảng</div>
              <select className="input-field" value={platform} onChange={e=>setPlatform(e.target.value)}>
                <option>Facebook</option><option>Instagram</option><option>TikTok</option><option>Zalo</option><option>LinkedIn</option>
              </select>
            </div>
            <div className="input-group">
              <div className="input-label">Ngôn ngữ</div>
              <select className="input-field" value={lang} onChange={e=>setLang(e.target.value)}>
                <option value="vi">🇻🇳 Tiếng Việt</option>
                <option value="en">🇺🇸 English</option>
              </select>
            </div>
          </div>
        </div>
        <button className="run-btn" onClick={runPipeline} disabled={running || !apiKey || !brand || !goal}>
          {running ? '⏳ Pipeline đang chạy... 16 agents đang làm việc' : '🚀 Chạy Pipeline 16 Agents'}
        </button>
      </div>

      {/* PIPELINE */}
      <div className="pipeline">
        {LAYERS.map(layer => {
          const agents = AGENTS.filter(a => layer.agentIds.includes(a.id));
          return (
            <div className="layer" key={layer.id}>
              <div className="layer-header">
                <span className={`layer-badge ${layer.badge}`}>{layer.id.toUpperCase()}</span>
                <span className="layer-name">{layer.label}</span>
              </div>
              <div className={`agents-row ${getGridClass(agents.length)}`}>
                {agents.map(agent => {
                  const state = agentStates[agent.id] || 'idle';
                  const output = agentOutputs[agent.id] || '';
                  const progress = agentProgress[agent.id] || 0;
                  return (
                    <div className={`agent-card ${state}`} key={agent.id}>
                      <div className="agent-icon">{agent.icon}</div>
                      <div className="agent-name">{agent.name}</div>
                      <div className="agent-role">{agent.role}</div>
                      <div className="agent-status">
                        <div className={`status-dot dot-${state}`}></div>
                        <span style={{color: state==='done'?'#34d399': state==='active'?'#a78bfa': state==='error'?'#f87171':'#4b5563'}}>
                          {state==='idle'?'IDLE': state==='active'?'RUNNING…': state==='done'?'DONE': 'ERROR'}
                        </span>
                      </div>
                      {output && <div className="agent-output">{output}</div>}
                      {state==='active' && <div className="agent-progress" style={{width:`${progress}%`}}></div>}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      {/* ACTIVITY */}
      <div className="activity">
        <div className="section-title">📡 Activity Stream</div>
        <div className="activity-list">
          {activity.length === 0 && <div style={{color:'#374151',fontSize:11,fontFamily:'JetBrains Mono',padding:'8px 0'}}>Chưa có hoạt động — nhấn Run Pipeline để bắt đầu</div>}
          {activity.map((a,i) => (
            <div className="activity-item" key={i}>
              <span className="activity-time">{a.time}</span>
              <span className="activity-agent">[{a.agent}]</span>
              <span className={`activity-msg ${a.type}`}>{a.msg}</span>
            </div>
          ))}
        </div>
      </div>

      {/* OUTPUT */}
      <div className="output-section">
        <div className="section-title">📦 Output</div>
        <div className="output-tabs">
          {[['content','✍️ Content'],['strategy','🎯 Strategy'],['kpi','📊 KPIs']].map(([k,l])=>(
            <button key={k} className={`tab-btn ${activeTab===k?'active':''}`} onClick={()=>setActiveTab(k)}>{l}</button>
          ))}
        </div>
        <div className="output-content">
          {outputs[activeTab] || <span className="output-placeholder">Output sẽ hiển thị sau khi pipeline hoàn thành...</span>}
        </div>
      </div>

      {/* FOOTER STATS */}
      <div className="footer-stats">
        <div className="stat-card"><div className="stat-value">{stats.runs}</div><div className="stat-label">Campaigns Ran</div></div>
        <div className="stat-card"><div className="stat-value">{stats.agents}</div><div className="stat-label">Agents Used</div></div>
        <div className="stat-card"><div className="stat-value">{stats.tokens}k</div><div className="stat-label">Tokens Est.</div></div>
        <div className="stat-card"><div className="stat-value">{stats.time}s</div><div className="stat-label">Last Run Time</div></div>
      </div>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
