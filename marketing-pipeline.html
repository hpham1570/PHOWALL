// ─── IN-MEMORY DB ────────────────────────────────────────────────────────────
const db = {
  campaigns: [], nextId: 1,
  save(table, record) {
    const id = `CAM-${String(this.nextId++).padStart(4,"0")}`;
    const row = { id, createdAt: new Date().toISOString(), ...record };
    this[table].push(row);
    return row;
  }
};

// ─── AGENT PROMPTS ───────────────────────────────────────────────────────────
const PROMPTS = {
  intake: (b) => `You are the Intake Agent of a Marketing Pipeline. Validate and classify this brief. Return ONLY valid JSON, no markdown.
Brief: "${b}"
Return: {"status":"ACCEPTED"|"REJECTED","classification":"SINGLE_POST"|"CAMPAIGN"|"MULTI_PLATFORM"|"URGENT","priority":"low"|"normal"|"high"|"urgent","validation_score":0-100,"missing_fields":[],"reason":"string if REJECTED","enriched":{"campaign_type":"product_launch|brand_awareness|promotion|event|content","target_audience":"detected","platforms_detected":["facebook"],"tone_detected":"friendly","key_message":"summary"}}`,

  security: (b) => `You are the Security Agent for a marketing system. Check content safety. Return ONLY valid JSON.
Brief: "${b}"
Return: {"safe":true,"risk_level":"none"|"low"|"medium"|"high","flags":[],"approved":true,"notes":"string"}
Check: medical claims, political content, competitor attacks, discounts >70%, prohibited keywords.`,

  researcher: (b, d) => `You are Research Assembly Agent 1. Gather market context. Return ONLY valid JSON, keep values SHORT (max 20 words each).
Brief: "${b}" Intake: ${JSON.stringify(d)}
Return: {"market_insights":["s","s","s"],"competitor_landscape":"2 sentences","audience_pain_points":["s","s","s"],"trending_angles":["s","s"],"recommended_hooks":["s","s","s"],"research_confidence":0-100}`,

  strategist: (b, r) => `You are Strategy Assembly Agent 2. Build campaign strategy. Return ONLY valid JSON, keep values SHORT.
Brief: "${b}" Research: ${JSON.stringify(r)}
Return: {"campaign_objective":"string","positioning_statement":"string","key_messages":["s","s","s"],"content_pillars":["s","s","s"],"call_to_action":"string","channel_strategy":{"primary":"facebook","secondary":["instagram"],"posting_frequency":"daily"},"success_metrics":["s","s"],"strategy_confidence":0-100}`,

  creator: (b, s) => `You are Content Creator Assembly Agent 3. Create campaign content. Return ONLY valid JSON.
Brief: "${b}" Strategy: ${JSON.stringify(s)}
Return: {"headline":"string","body_copy":"100-200 words max","social_captions":{"facebook":"string","instagram":"string","tiktok":"string"},"hashtags":["#tag1","#tag2","#tag3","#tag4","#tag5"],"email_subject":"string","cta_button_text":"string","creator_confidence":0-100}`,

  qc: (c, s, b) => `You are the QC Agent. Score content compliance. Return ONLY valid JSON, be concise.
Brief: "${b}" Strategy objectives: "${s.campaign_objective}" Content headline: "${c.headline}"
Return: {"verdict":"PASS"|"FAIL"|"PASS_WITH_NOTES","overall_score":0-100,"dimensions":{"brand_alignment":0-100,"message_clarity":0-100,"cta_strength":0-100,"audience_fit":0-100,"platform_suitability":0-100},"passed_checks":["s","s"],"failed_checks":[],"improvement_suggestions":["s"],"approved_for_publish":true}`,

  reporter: (d) => `You are the Reporter Agent. Generate KPI summary. Return ONLY valid JSON, be very concise.
Campaign: brief="${d.brief}" qc_score=${d.qc&&d.qc.overall_score} pipeline_health estimated
Return: {"run_summary":"2 sentences max","pipeline_health":"excellent"|"good"|"fair"|"poor","kpis":{"quality_score":0-100,"predicted_reach":"string","predicted_engagement_rate":"string"},"strengths":["s","s"],"risks":["s"],"next_actions":["s","s","s"]}`
};

// ─── AGENT RUNNER ─────────────────────────────────────────────────────────────
async function runAgent(prompt, apiKey) {
  const r = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","anthropic-dangerous-direct-browser-access":"true","x-api-key":apiKey,"anthropic-version":"2023-06-01"},
    body: JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1500,messages:[{role:"user",content:prompt}]})
  });
  const data = await r.json();
  if(data.error) throw new Error(data.error.message);
  const text = data.content.filter(b=>b.type==="text").map(b=>b.text).join("");
  let clean = text.replace(/```json|```/gi,"").trim();
  try { return JSON.parse(clean); }
  catch(e) {
    const lb = clean.lastIndexOf("}"), lc = clean.lastIndexOf(",");
    clean = lb > lc ? clean.substring(0,lb+1) : clean.substring(0,lc)+"}";
    const opens=(clean.match(/{/g)||[]).length, closes=(clean.match(/}/g)||[]).length;
    clean += "}".repeat(Math.max(0,opens-closes));
    return JSON.parse(clean);
  }
}

// ─── CONSTANTS ────────────────────────────────────────────────────────────────
const STATUS_COLORS = {
  idle:{color:"#6b7280",bg:"#1f2937",label:"IDLE"},
  running:{color:"#f59e0b",bg:"#451a03",label:"RUNNING"},
  success:{color:"#10b981",bg:"#022c22",label:"DONE"},
  error:{color:"#ef4444",bg:"#450a0a",label:"ERROR"},
  skipped:{color:"#4b5563",bg:"#111827",label:"SKIPPED"},
  warning:{color:"#f59e0b",bg:"#451a03",label:"WARNING"}
};
const AGENTS = [
  {id:"intake",icon:"⬛",name:"Intake Agent",role:"Validate & Classify"},
  {id:"security",icon:"🔒",name:"Security Agent",role:"Safety Check"},
  {id:"researcher",icon:"🔬",name:"Researcher",role:"Assembly Agent 1"},
  {id:"strategist",icon:"🧠",name:"Strategist",role:"Assembly Agent 2"},
  {id:"creator",icon:"✍️",name:"Content Creator",role:"Assembly Agent 3"},
  {id:"qc",icon:"✅",name:"QC Agent",role:"Brand Compliance"},
  {id:"reporter",icon:"📊",name:"Reporter",role:"Analytics & KPIs"},
];
const LAYERS = [
  {key:"inputLayer",ids:["intake","security"]},
  {key:"assemblyLayer",ids:["researcher","strategist","creator"]},
  {key:"outputLayer",ids:["qc","reporter"]},
];

// ─── APP ──────────────────────────────────────────────────────────────────────
function App() {
  const [apiKey,setApiKey]=useState("");
  const [apiKeySet,setApiKeySet]=useState(false);
  const [brief,setBrief]=useState("");
  const [running,setRunning]=useState(false);
  const [tab,setTab]=useState("pipeline");
  const [lang,setLang]=useState("en");
  const [selected,setSelected]=useState(null);
  const [logs,setLogs]=useState([]);
  const [results,setResults]=useState(null);
  const [history,setHistory]=useState([]);
  const [agentSt,setAgentSt]=useState(Object.fromEntries(AGENTS.map(a=>[a.id,{status:"idle",data:null}])));
  const logsEnd=useRef(null);
  const t=T[lang];

  useEffect(()=>{ logsEnd.current?.scrollIntoView({behavior:"smooth"}); },[logs]);

  const log=(agent,type,msg)=>setLogs(p=>[...p,{id:Date.now()+Math.random(),time:new Date().toLocaleTimeString(),agent,type,msg}]);
  const setSt=(id,u)=>setAgentSt(p=>({...p,[id]:{...p[id],...u}}));
  const sc=(id)=>STATUS_COLORS[agentSt[id]?.status||"idle"];

  const reset=()=>{
    setAgentSt(Object.fromEntries(AGENTS.map(a=>[a.id,{status:"idle",data:null}])));
    setLogs([]); setResults(null); setSelected(null); setTab("pipeline");
  };

  const runPipeline=async()=>{
    if(!brief.trim()||brief.length<15||!apiKey) return;
    reset(); setRunning(true);
    const start=Date.now(); const D={};
    try {
      // INTAKE
      log("intake","start","Receiving campaign brief...");
      setSt("intake",{status:"running"});
      const intake=await runAgent(PROMPTS.intake(brief),apiKey);
      D.intake=intake;
      if(intake.status==="REJECTED"){
        setSt("intake",{status:"warning",data:intake});
        log("intake","warn",`REJECTED: ${intake.reason}`);
        ["security","researcher","strategist","creator","qc","reporter"].forEach(id=>setSt(id,{status:"skipped"}));
        setResults({aborted:true,reason:intake.reason}); setRunning(false); setTab("results"); return;
      }
      setSt("intake",{status:"success",data:intake});
      log("intake","success",`ACCEPTED — ${intake.classification} | Score: ${intake.validation_score}`);

      // SECURITY
      log("security","start","Running content safety check...");
      setSt("security",{status:"running"});
      const sec=await runAgent(PROMPTS.security(brief),apiKey);
      D.security=sec;
      if(!sec.approved){
        setSt("security",{status:"error",data:sec});
        log("security","error",`BLOCKED — Risk: ${sec.risk_level}`);
        ["researcher","strategist","creator","qc","reporter"].forEach(id=>setSt(id,{status:"skipped"}));
        setResults({aborted:true,reason:`Security: ${sec.notes}`}); setRunning(false); setTab("results"); return;
      }
      setSt("security",{status:"success",data:sec});
      log("security","success",`CLEARED — Risk: ${sec.risk_level}`);

      // RESEARCHER
      log("researcher","start","Analyzing market landscape...");
      setSt("researcher",{status:"running"});
      const research=await runAgent(PROMPTS.researcher(brief,intake.enriched),apiKey);
      D.research=research;
      setSt("researcher",{status:"success",data:research});
      log("researcher","success",`Research done — Confidence: ${research.research_confidence}%`);

      // STRATEGIST
      log("strategist","start","Building campaign strategy...");
      setSt("strategist",{status:"running"});
      const strategy=await runAgent(PROMPTS.strategist(brief,research),apiKey);
      D.strategy=strategy;
      setSt("strategist",{status:"success",data:strategy});
      log("strategist","success",`Strategy built — Confidence: ${strategy.strategy_confidence}%`);

      // CREATOR
      log("creator","start","Generating campaign content...");
      setSt("creator",{status:"running"});
      const content=await runAgent(PROMPTS.creator(brief,strategy),apiKey);
      D.content=content;
      setSt("creator",{status:"success",data:content});
      log("creator","success",`Content created — Confidence: ${content.creator_confidence}%`);

      // QC
      log("qc","start","Running brand compliance check...");
      setSt("qc",{status:"running"});
      const qc=await runAgent(PROMPTS.qc(content,strategy,brief),apiKey);
      D.qc=qc;
      setSt("qc",{status:qc.verdict==="FAIL"?"error":"success",data:qc});
      log("qc",qc.verdict==="FAIL"?"error":"success",`QC ${qc.verdict} — Score: ${qc.overall_score}/100`);

      // REPORTER
      log("reporter","start","Generating KPI report...");
      setSt("reporter",{status:"running"});
      const report=await runAgent(PROMPTS.reporter({brief,...D}),apiKey);
      D.report=report;
      setSt("reporter",{status:"success",data:report});
      log("reporter","success",`Report done — Health: ${report.pipeline_health.toUpperCase()}`);

      // SAVE
      const saved=db.save("campaigns",{brief,...D,duration_ms:Date.now()-start});
      setHistory(db.campaigns.slice().reverse());
      log("reporter","info",`Saved — ID: ${saved.id}`);
      setResults({success:true,...D,id:saved.id});
      setTimeout(()=>setTab("results"),500);

    } catch(err) {
      const failing=AGENTS.find(a=>agentSt[a.id]?.status==="running");
      if(failing) setSt(failing.id,{status:"error"});
      log("system","error",`Pipeline aborted: ${err.message}`);
    } finally { setRunning(false); }
  };

  // ─── RENDER ──────────────────────────────────────────────────────────────
  return (
    <div style={{fontFamily:"'Inter','Segoe UI',sans-serif",background:"#050810",minHeight:"100vh",color:"#e2e8f0"}}>

      {/* HEADER */}
      <div style={{background:"linear-gradient(135deg,#0f1629,#1a0a2e)",borderBottom:"1px solid #1e2a45",padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,background:"linear-gradient(135deg,#6366f1,#8b5cf6)",borderRadius:9,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>⚡</div>
          <div>
            <div style={{fontSize:15,fontWeight:700,color:"#e2e8f0"}}>{t.appTitle}</div>
            <div style={{fontSize:10,color:"#6366f1",fontWeight:600,letterSpacing:"1.2px"}}>{t.appSubtitle}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>
          {/* Lang toggle */}
          <div style={{display:"flex",background:"#0d1224",borderRadius:7,border:"1px solid #1e2a45",overflow:"hidden",marginRight:6}}>
            {["en","es","vi"].map(l=>(
              <button key={l} onClick={()=>setLang(l)} style={{padding:"4px 10px",border:"none",cursor:"pointer",fontSize:10,fontWeight:700,background:lang===l?"#6366f1":"transparent",color:lang===l?"#fff":"#64748b"}}>
                {l.toUpperCase()}
              </button>
            ))}
          </div>
          {Object.entries(t.tabs).map(([k,label])=>(
            <button key={k} onClick={()=>setTab(k)} style={{padding:"5px 12px",borderRadius:6,border:"none",cursor:"pointer",fontSize:11,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.5px",background:tab===k?"#6366f1":"transparent",color:tab===k?"#fff":"#64748b"}}>
              {label}
            </button>
          ))}
        </div>
      </div>

      <div style={{maxWidth:1200,margin:"0 auto",padding:"20px 16px",display:"grid",gridTemplateColumns:"1fr 320px",gap:16}}>

        {/* LEFT */}
        <div>
          {/* API KEY / BRIEF */}
          {tab==="pipeline" && (
            <div style={{background:"#0d1224",border:"1px solid #1e2a45",borderRadius:12,padding:18,marginBottom:16}}>
              {!apiKeySet ? (
                <>
                  <div style={{fontSize:11,color:"#6366f1",fontWeight:700,letterSpacing:"1px",marginBottom:8}}>{t.apiKeyLabel}</div>
                  <div style={{display:"flex",gap:8}}>
                    <input type="password" value={apiKey} onChange={e=>setApiKey(e.target.value)}
                      placeholder="sk-ant-api03-..."
                      style={{flex:1,background:"#050810",border:"1px solid #1e2a45",borderRadius:7,padding:"9px 12px",color:"#e2e8f0",fontSize:13,outline:"none"}}/>
                    <button onClick={()=>{if(apiKey.trim().length>10)setApiKeySet(true);}}
                      style={{padding:"9px 16px",background:"#6366f1",color:"#fff",border:"none",borderRadius:7,fontWeight:700,cursor:"pointer",fontSize:12}}>
                      {t.setKey}
                    </button>
                  </div>
                </>
              ):(
                <>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <div style={{fontSize:11,color:"#6366f1",fontWeight:700,letterSpacing:"1px"}}>{t.briefLabel}</div>
                    <button onClick={()=>{setApiKeySet(false);setApiKey("");}} style={{background:"transparent",border:"none",color:"#4b5563",fontSize:10,cursor:"pointer"}}>{t.changeKey}</button>
                  </div>
                  <textarea value={brief} onChange={e=>setBrief(e.target.value)} disabled={running}
                    placeholder={t.briefPlaceholder}
                    style={{width:"100%",minHeight:90,background:"#050810",border:"1px solid #1e2a45",borderRadius:7,padding:"10px 12px",color:"#e2e8f0",fontSize:12,resize:"vertical",outline:"none",boxSizing:"border-box",lineHeight:1.6}}/>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:10}}>
                    <span style={{fontSize:10,color:brief.length<15?"#ef4444":"#10b981"}}>{brief.length} {t.chars} {brief.length<15?t.minChars:"✓"}</span>
                    <div style={{display:"flex",gap:8}}>
                      <button onClick={reset} disabled={running} style={{padding:"8px 14px",background:"transparent",border:"1px solid #1e2a45",color:"#6b7280",borderRadius:7,cursor:"pointer",fontSize:11,fontWeight:600}}>{t.reset}</button>
                      <button onClick={runPipeline} disabled={running||brief.length<15}
                        style={{padding:"8px 18px",background:running?"#374151":"linear-gradient(135deg,#6366f1,#8b5cf6)",color:"#fff",border:"none",borderRadius:7,fontWeight:700,cursor:running||brief.length<15?"not-allowed":"pointer",fontSize:12}}>
                        {running?t.running:t.runPipeline}
                      </button>
                    </div>
                  </div>
                </>
              )}
            </div>
          )}

          {/* PIPELINE VISUALIZATION */}
          {tab==="pipeline" && (
            <div style={{background:"#0d1224",border:"1px solid #1e2a45",borderRadius:12,padding:18,marginBottom:16}}>
              <div style={{fontSize:11,color:"#6366f1",fontWeight:700,letterSpacing:"1px",marginBottom:14}}>{t.agentPipeline}</div>
              {LAYERS.map(layer=>(
                <div key={layer.key} style={{marginBottom:10}}>
                  <div style={{fontSize:8,color:"#374151",fontWeight:700,letterSpacing:"2px",marginBottom:6,paddingLeft:2}}>{t[layer.key]}</div>
                  <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
                    {layer.ids.map(id=>{
                      const ag=AGENTS.find(a=>a.id===id);
                      const st=agentSt[id]; const col=sc(id);
                      return (
                        <div key={id} onClick={()=>setSelected(selected===id?null:id)}
                          style={{flex:"1 1 130px",minWidth:130,background:col.bg,border:`1px solid ${col.color}30`,borderRadius:9,padding:"10px 12px",cursor:"pointer",boxShadow:selected===id?`0 0 0 2px ${col.color}`:"none",transition:"all 0.2s",position:"relative",overflow:"hidden"}}>
                          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                            <span style={{fontSize:16}}>{ag.icon}</span>
                            <span style={{fontSize:8,fontWeight:700,color:col.color,letterSpacing:"1px",background:`${col.color}20`,padding:"2px 5px",borderRadius:3}}>{col.label}</span>
                          </div>
                          <div style={{marginTop:7}}>
                            <div style={{fontSize:11,fontWeight:700,color:"#e2e8f0"}}>{ag.name}</div>
                            <div style={{fontSize:9,color:"#6b7280",marginTop:1}}>{ag.role}</div>
                          </div>
                          {st?.data && (
                            <div style={{fontSize:9,color:col.color,marginTop:5,borderTop:`1px solid ${col.color}20`,paddingTop:5}}>
                              {id==="intake"&&`Score: ${st.data.validation_score}`}
                              {id==="security"&&`Risk: ${st.data.risk_level}`}
                              {id==="researcher"&&`Conf: ${st.data.research_confidence}%`}
                              {id==="strategist"&&`Conf: ${st.data.strategy_confidence}%`}
                              {id==="creator"&&`Conf: ${st.data.creator_confidence}%`}
                              {id==="qc"&&`Score: ${st.data.overall_score}/100`}
                              {id==="reporter"&&st.data.pipeline_health?.toUpperCase()}
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              ))}
              {selected&&agentSt[selected]?.data&&(
                <div style={{marginTop:12,background:"#050810",border:"1px solid #1e2a45",borderRadius:9,padding:14}}>
                  <div style={{fontSize:10,color:"#6366f1",fontWeight:700,letterSpacing:"1px",marginBottom:10}}>
                    {AGENTS.find(a=>a.id===selected)?.name.toUpperCase()} — OUTPUT
                  </div>
                  <pre style={{fontSize:10,color:"#94a3b8",margin:0,whiteSpace:"pre-wrap",wordBreak:"break-word",maxHeight:240,overflowY:"auto"}}>
                    {JSON.stringify(agentSt[selected].data,null,2)}
                  </pre>
                </div>
              )}
            </div>
          )}

          {/* RESULTS TAB */}
          {tab==="results"&&results&&(
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              {results.aborted?(
                <div style={{background:"#450a0a",border:"1px solid #ef444430",borderRadius:12,padding:18}}>
                  <div style={{color:"#ef4444",fontWeight:700,marginBottom:6}}>{t.pipelineAborted}</div>
                  <div style={{color:"#fca5a5",fontSize:12}}>{results.reason}</div>
                </div>
              ):(
                <>
                  {results.content&&(
                    <div style={{background:"#0d1224",border:"1px solid #1e2a45",borderRadius:12,padding:18}}>
                      <div style={{fontSize:11,color:"#6366f1",fontWeight:700,letterSpacing:"1px",marginBottom:14}}>{t.contentOutput}</div>
                      <div style={{marginBottom:12}}>
                        <div style={{fontSize:10,color:"#6b7280",marginBottom:3}}>{t.headline}</div>
                        <div style={{fontSize:17,fontWeight:700,color:"#e2e8f0",lineHeight:1.3}}>{results.content.headline}</div>
                      </div>
                      <div style={{marginBottom:12}}>
                        <div style={{fontSize:10,color:"#6b7280",marginBottom:3}}>{t.bodyCopy}</div>
                        <div style={{fontSize:12,color:"#94a3b8",lineHeight:1.7}}>{results.content.body_copy}</div>
                      </div>
                      <div style={{marginBottom:12}}>
                        <div style={{fontSize:10,color:"#6b7280",marginBottom:7}}>{t.socialCaptions}</div>
                        {Object.entries(results.content.social_captions||{}).map(([platform,caption])=>(
                          <div key={platform} style={{background:"#050810",borderRadius:7,padding:"9px 12px",marginBottom:7}}>
                            <div style={{fontSize:9,color:"#6366f1",fontWeight:700,marginBottom:3,textTransform:"uppercase"}}>{platform}</div>
                            <div style={{fontSize:11,color:"#94a3b8",lineHeight:1.6}}>{caption}</div>
                          </div>
                        ))}
                      </div>
                      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:12}}>
                        {(results.content.hashtags||[]).map(tag=>(
                          <span key={tag} style={{background:"#1e1b4b",color:"#818cf8",padding:"2px 9px",borderRadius:20,fontSize:10,fontWeight:600}}>{tag}</span>
                        ))}
                      </div>
                      <div style={{display:"flex",gap:10}}>
                        <div style={{flex:1,background:"#050810",borderRadius:7,padding:"9px 12px"}}>
                          <div style={{fontSize:9,color:"#6b7280",marginBottom:3}}>{t.emailSubject}</div>
                          <div style={{fontSize:11,color:"#e2e8f0"}}>{results.content.email_subject}</div>
                        </div>
                        <div style={{flex:1,background:"#050810",borderRadius:7,padding:"9px 12px"}}>
                          <div style={{fontSize:9,color:"#6b7280",marginBottom:3}}>{t.cta}</div>
                          <div style={{fontSize:11,color:"#10b981",fontWeight:700}}>{results.content.cta_button_text}</div>
                        </div>
                      </div>
                    </div>
                  )}
                  {results.qc&&(
                    <div style={{background:"#0d1224",border:`1px solid ${results.qc.verdict==="FAIL"?"#ef444430":"#10b98130"}`,borderRadius:12,padding:18}}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
                        <div style={{fontSize:11,color:"#6366f1",fontWeight:700,letterSpacing:"1px"}}>{t.qcScorecard}</div>
                        <div style={{fontSize:22,fontWeight:800,color:results.qc.overall_score>=80?"#10b981":"#f59e0b"}}>{results.qc.overall_score}</div>
                      </div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:7}}>
                        {Object.entries(results.qc.dimensions||{}).map(([key,val])=>(
                          <div key={key} style={{background:"#050810",borderRadius:7,padding:"7px 11px"}}>
                            <div style={{fontSize:9,color:"#6b7280",marginBottom:3,textTransform:"uppercase",letterSpacing:"0.5px"}}>{key.replace(/_/g," ")}</div>
                            <div style={{display:"flex",alignItems:"center",gap:7}}>
                              <div style={{flex:1,height:3,background:"#1e2a45",borderRadius:2}}>
                                <div style={{height:"100%",width:`${val}%`,background:val>=80?"#10b981":val>=60?"#f59e0b":"#ef4444",borderRadius:2}}/>
                              </div>
                              <span style={{fontSize:10,fontWeight:700,color:"#e2e8f0",minWidth:24}}>{val}</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                  {results.report&&(
                    <div style={{background:"#0d1224",border:"1px solid #1e2a45",borderRadius:12,padding:18}}>
                      <div style={{fontSize:11,color:"#6366f1",fontWeight:700,letterSpacing:"1px",marginBottom:10}}>{t.pipelineReport}</div>
                      <div style={{fontSize:12,color:"#94a3b8",lineHeight:1.7,marginBottom:14}}>{results.report.run_summary}</div>
                      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:7,marginBottom:14}}>
                        {[[t.qualityScore,`${results.report.kpis?.quality_score}/100`],[t.predictedReach,results.report.kpis?.predicted_reach],[t.engRate,results.report.kpis?.predicted_engagement_rate]].map(([label,val])=>(
                          <div key={label} style={{background:"#050810",borderRadius:7,padding:"9px 12px",textAlign:"center"}}>
                            <div style={{fontSize:16,fontWeight:800,color:"#6366f1"}}>{val}</div>
                            <div style={{fontSize:9,color:"#6b7280",marginTop:2}}>{label}</div>
                          </div>
                        ))}
                      </div>
                      <div style={{fontSize:10,color:"#6b7280",marginBottom:5}}>{t.nextActions}</div>
                      {(results.report.next_actions||[]).map((a,i)=>(
                        <div key={i} style={{fontSize:11,color:"#94a3b8",padding:"3px 0",borderBottom:"1px solid #0f1629"}}>→ {a}</div>
                      ))}
                    </div>
                  )}
                </>
              )}
            </div>
          )}

          {/* HISTORY TAB */}
          {tab==="history"&&(
            <div style={{background:"#0d1224",border:"1px solid #1e2a45",borderRadius:12,padding:18}}>
              <div style={{fontSize:11,color:"#6366f1",fontWeight:700,letterSpacing:"1px",marginBottom:14}}>{t.campaignHistory}</div>
              {history.length===0?(
                <div style={{color:"#374151",fontSize:12,textAlign:"center",padding:"40px 0"}}>{t.noHistory}</div>
              ):history.map(c=>(
                <div key={c.id} style={{background:"#050810",borderRadius:7,padding:"11px 14px",marginBottom:7}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
                    <div style={{fontSize:10,color:"#6366f1",fontWeight:700}}>{c.id}</div>
                    <div style={{fontSize:9,color:"#374151"}}>{new Date(c.createdAt).toLocaleString()}</div>
                  </div>
                  <div style={{fontSize:11,color:"#94a3b8",marginTop:3,lineHeight:1.5}}>{c.brief?.slice(0,110)}...</div>
                  <div style={{marginTop:5,display:"flex",gap:8}}>
                    <span style={{fontSize:9,color:"#10b981"}}>QC: {c.qc?.overall_score}/100</span>
                    <span style={{fontSize:9,color:"#6b7280"}}>•</span>
                    <span style={{fontSize:9,color:"#f59e0b"}}>{c.report?.pipeline_health}</span>
                    <span style={{fontSize:9,color:"#6b7280"}}>•</span>
                    <span style={{fontSize:9,color:"#6b7280"}}>{Math.round(c.duration_ms/1000)}s</span>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>

        {/* RIGHT: ACTIVITY STREAM */}
        <div>
          <div style={{background:"#0d1224",border:"1px solid #1e2a45",borderRadius:12,padding:14,height:"calc(100vh - 110px)",display:"flex",flexDirection:"column",position:"sticky",top:16}}>
            <div style={{fontSize:11,color:"#6366f1",fontWeight:700,letterSpacing:"1px",marginBottom:10}}>{t.activityStream}</div>
            <div style={{flex:1,overflowY:"auto",fontFamily:"'Fira Code','Courier New',monospace"}}>
              {logs.length===0?(
                <div style={{color:"#1e2a45",fontSize:10,marginTop:16,textAlign:"center"}}>{t.waitingLog}</div>
              ):logs.map(l=>{
                const cols={start:"#6366f1",success:"#10b981",error:"#ef4444",warn:"#f59e0b",info:"#6b7280"};
                const ag=AGENTS.find(a=>a.id===l.agent);
                return (
                  <div key={l.id} style={{padding:"3px 0",borderBottom:"1px solid #0a0f1e"}}>
                    <span style={{color:"#374151",fontSize:9}}>{l.time} </span>
                    <span style={{color:cols[l.type]||"#6b7280",fontSize:9,fontWeight:700}}>[{ag?.icon||"⚙"} {l.agent.toUpperCase()}]</span>
                    <span style={{color:"#94a3b8",fontSize:10,marginLeft:5}}>{l.msg}</span>
                  </div>
                );
              })}
              <div ref={logsEnd}/>
            </div>
            <div style={{marginTop:10,paddingTop:10,borderTop:"1px solid #1e2a45",display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6}}>
              {[[t.runs,history.length],[t.agents,7],[t.memory,`${db.campaigns.length} ${t.rows}`]].map(([label,val])=>(
                <div key={label} style={{textAlign:"center"}}>
                  <div style={{fontSize:15,fontWeight:800,color:"#6366f1"}}>{val}</div>
                  <div style={{fontSize:8,color:"#374151",letterSpacing:"1px"}}>{label}</div>
                </div>
              ))}
            </div>
          </div>
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
